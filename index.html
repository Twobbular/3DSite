<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DSite - Home Menu</title>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --top-screen-bg: #ffffff;
            --bottom-screen-bg: #f9d3d9; 
            --accent-red: #e60012;
            --border-gray: #333;
            --depth-offset: 4px;
            --depth-blur: 10px;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Power Overlay */
        #power-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
        }

        /* Console Layout */
        .console-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* 3D Slider Section */
        .slider-container {
            position: absolute;
            right: -50px;
            top: 40px;
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            font-size: 10px;
            font-weight: bold;
        }

        .slider-container input {
            writing-mode: bt-lr; 
            appearance: slider-vertical;
            width: 8px;
            height: 120px;
            margin: 5px 0;
            cursor: pointer;
        }

        /* Top Screen */
        .top-screen {
            width: 400px;
            height: 240px;
            background: var(--top-screen-bg);
            border: 8px solid var(--border-gray);
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            perspective: 500px;
        }

        .status-bar {
            position: absolute;
            top: 0;
            width: 100%;
            height: 25px;
            background: rgba(255,255,255,0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
            font-size: 11px;
            color: #333;
            border-bottom: 1px solid #ddd;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.5);
            z-index: 10;
        }

        .game-banner {
            width: 100px;
            height: 100px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 var(--depth-offset) var(--depth-blur) rgba(0,0,0,0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 5;
            border-radius: 10px;
            overflow: hidden;
        }

        .game-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .launch-anim {
            animation: bounce-effect 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounce-effect {
            0% { transform: scale(1) translateY(0); }
            30% { transform: scale(1.15) translateY(-20px); }
            50% { transform: scale(0.9) translateY(0); }
            100% { transform: scale(1) translateY(0); }
        }

        /* Bottom Screen Container */
        .bottom-screen {
            width: 320px;
            height: 240px;
            background: var(--bottom-screen-bg);
            border: 8px solid var(--border-gray);
            border-radius: 12px;
            padding: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .utility-row {
            display: flex;
            justify-content: space-around;
            padding-bottom: 5px;
            border-bottom: 2px solid rgba(255,255,255,0.5);
            margin-bottom: 8px;
        }

        .util-icon {
            width: 34px;
            height: 34px;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 0 #ccc;
            border: 2px solid transparent;
            overflow: hidden; /* Important for the fill */
        }

        .util-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Changed from contain to cover to fill */
        }

        .util-icon:active { transform: translateY(2px); box-shadow: 0 0 0 #ccc; }
        .util-icon:hover { border: 2px solid var(--accent-red); }

        /* Scrollable Game Area */
        .scroll-container {
            flex-grow: 1;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            padding-bottom: 40px; 
            scrollbar-width: none;
        }
        .scroll-container::-webkit-scrollbar { display: none; }

        .game-grid {
            display: inline-grid;
            grid-template-rows: repeat(2, 1fr);
            grid-auto-flow: column;
            grid-gap: 8px;
            height: 100%;
        }

        .icon {
            background: white;
            border-radius: 10px;
            width: 65px;
            height: 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid #ddd;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
            transition: transform 0.1s;
            overflow: hidden;
        }

        .icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .icon:hover { border-color: var(--accent-red); transform: scale(1.05); }

        /* Start Button */
        #start-btn {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 32px;
            background: #fff;
            border: 2px solid #aaa;
            border-radius: 20px;
            font-weight: bold;
            color: #333;
            display: none; 
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #start-btn:active { background: #eee; transform: translateX(-50%) translateY(1px); }

        h1.logo { color: white; font-size: 20px; margin-bottom: 10px; }
        h1.logo span { color: var(--accent-red); }
    </style>
</head>
<body>

    <div id="power-overlay" onclick="startConsole()">
        <div style="font-size: 50px;">🔴</div>
        <p>Power On</p>
    </div>

    <h1 class="logo">3D<span>Site</span></h1>

    <div class="console-container">
        <div class="slider-container">
            <span>3D</span>
            <input type="range" id="depthSlider" min="0" max="100" value="50" oninput="updateDepth(this.value)">
            <span>OFF</span>
        </div>

        <div class="top-screen">
            <div class="status-bar">
                <span>🛜 Internet</span>
                <span id="clock">00:00 AM</span>
            </div>
            <div class="game-banner" id="banner">
                <img src="https://raw.githubusercontent.com/Twobbular/3DSite/main/assets/home%20menu/icons/settings.png" alt="Home">
            </div>
            <p id="game-title" style="margin-top: 10px; font-weight: bold; color: #333;">Home Menu</p>
        </div>

        <div class="bottom-screen">
            <div class="utility-row">
                <div class="util-icon" onclick="selectGame('Game Notes', 'game notes.png')">
                    <img src="https://raw.githubusercontent.com/Twobbular/3DSite/main/assets/home%20menu/icons/game%20notes.png">
                </div>
                <div class="util-icon" onclick="selectGame('Friend List', 'friendlist.png')">
                    <img src="https://raw.githubusercontent.com/Twobbular/3DSite/main/assets/home%20menu/icons/friendlist.png">
                </div>
                <div class="util-icon" onclick="selectGame('Notifications', 'notifications.png')">
                    <img src="https://raw.githubusercontent.com/Twobbular/3DSite/main/assets/home%20menu/icons/notifications.png">
                </div>
                <div class="util-icon" onclick="selectGame('Internet Browser', 'internet.png')">
                    <img src="https://raw.githubusercontent.com/Twobbular/3DSite/main/assets/home%20menu/icons/internet.png">
                </div>
            </div>

            <div class="scroll-container">
                <div class="game-grid">
                    <div class="icon" onclick="selectGame('Mario Kart 7', 'mariokart7.png')">
                        <img src="https://raw.githubusercontent.com/Twobbular/3DSite/main/assets/home%20menu/icons/mariokart7.png">
                    </div>
                    <div class="icon" onclick="selectGame('Pokémon', 'pokemon.png')">
                        <img src="https://raw.githubusercontent.com/Twobbular/3DSite/main/assets/home%20menu/icons/pokemon.png">
                    </div>
                    <div class="icon" onclick="selectGame('Zelda', 'zelda.png')">
                        <img src="https://raw.githubusercontent.com/Twobbular/3DSite/main/assets/home%20menu/icons/zelda.png">
                    </div>
                    <div class="icon" onclick="selectGame('Tomodachi Life', 'tomodachilife.png')">
                        <img src="https://raw.githubusercontent.com/Twobbular/3DSite/main/assets/home%20menu/icons/tomodachilife.png">
                    </div>
                    <div class="icon" onclick="selectGame('Settings', 'settings.png')">
                        <img src="https://raw.githubusercontent.com/Twobbular/3DSite/main/assets/home%20menu/icons/settings.png">
                    </div>
                    <div class="icon" onclick="selectGame('Camera', 'camera.png')">
                        <img src="https://raw.githubusercontent.com/Twobbular/3DSite/main/assets/home%20menu/icons/camera.png">
                    </div>
                    <div class="icon" onclick="selectGame('Download Play', 'download play.png')">
                        <img src="https://raw.githubusercontent.com/Twobbular/3DSite/main/assets/home%20menu/icons/download%20play.png">
                    </div>
                    <div class="icon" onclick="selectGame('Face Raiders', 'face raiders.png')">
                        <img src="https://raw.githubusercontent.com/Twobbular/3DSite/main/assets/home%20menu/icons/face%20raiders.png">
                    </div>
                </div>
            </div>

            <div id="start-btn" onclick="launchGame()">Start</div>
        </div>
    </div>

    <audio id="bgm" loop>
        <source src="https://vgmtreasurechest.com/soundtracks/nintendo-3ds-background-music/ojgeaqbl/02.%20Home%20Menu.mp3" type="audio/mpeg">
    </audio>

    <audio id="click-sfx">
        <source src="https://lambda.vgmtreasurechest.com/soundtracks/nintendo-3ds-sound-sound-effects-3ds-gamerip-2011/umznpjdo/1-13.%20Menu%20Sounds%20Touch.mp3" type="audio/mpeg">
    </audio>

    <script>
        let currentGame = "";
        const ICON_BASE_URL = "https://raw.githubusercontent.com/Twobbular/3DSite/main/assets/home%20menu/icons/";

        function startConsole() {
            document.getElementById('power-overlay').style.display = 'none';
            const audio = document.getElementById('bgm');
            audio.volume = 0.4;
            audio.play();
            updateDepth(50); 
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            minutes = minutes < 10 ? '0'+minutes : minutes;
            document.getElementById('clock').textContent = hours + ':' + minutes + ' ' + ampm;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function updateDepth(val) {
            const intensity = val / 100;
            document.querySelector(':root').style.setProperty('--depth-offset', (intensity * 12) + 'px');
            document.querySelector(':root').style.setProperty('--depth-blur', (intensity * 20) + 'px');
            document.getElementById('banner').style.transform = `translateZ(${intensity * 30}px)`;
        }

        function selectGame(name, iconFileName) {
            currentGame = name;
            const banner = document.getElementById('banner');
            document.getElementById('game-title').innerText = name;
            
            const encodedFile = encodeURIComponent(iconFileName);
            banner.innerHTML = `<img src="${ICON_BASE_URL}${encodedFile}" alt="${name}">`;

            document.getElementById('start-btn').style.display = 'flex';

            banner.classList.remove('launch-anim');
            void banner.offsetWidth; 
            banner.classList.add('launch-anim');

            const sfx = document.getElementById('click-sfx');
            sfx.currentTime = 0; 
            sfx.play();
        }

        function launchGame() {
            if (!currentGame) return;
            const slug = currentGame.toLowerCase().replace(/\s+/g, '');
            window.location.href = `https://twobbular.github.io/3dsite/${slug}`;
        }
    </script>
</body>
</html>
